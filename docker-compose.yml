services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newgen
      POSTGRES_USER: newgen
      POSTGRES_PASSWORD: newgen_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://newgen:newgen_pass@postgres:5432/newgen
      OLLAMA_URL: http://ollama:11434
      JWT_SECRET: change-this-in-production
      UPLOAD_DIR: /app/uploads
      FAISS_DIR: /app/faiss_indices
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_indices:/app/faiss_indices
    depends_on:
      - postgres
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
